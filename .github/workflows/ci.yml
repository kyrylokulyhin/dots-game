name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

  deploy:
    needs: [test, terraform]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: vm-dots-game
      cancel-in-progress: false
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER }}

    steps:
      - uses: actions/checkout@v6

      - name: Check environment is configured
        run: |
          if [ -z "${VM_HOST}" ] || [ -z "${VM_USER}" ]; then
            echo "::error::The production environment is not configured. Run infra/scripts/configure-github-actions.sh."
            exit 1
          fi

      - name: Write deploy key
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy

      - name: Add VM to known hosts
        run: |
          tmp_known_hosts="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${VM_HOST}" > "${tmp_known_hosts}" 2>/dev/null && [ -s "${tmp_known_hosts}" ]; then
              cat "${tmp_known_hosts}" >> ~/.ssh/known_hosts
              rm -f "${tmp_known_hosts}"
              exit 0
            fi
            sleep 5
          done
          echo "Failed to fetch SSH host key from ${VM_HOST}" >&2
          exit 1

      - name: Create release archive
        run: tar -czf /tmp/dots-release.tgz server.js db.js package.json package-lock.json public

      - name: Upload release archive
        run: scp -i ~/.ssh/id_deploy /tmp/dots-release.tgz "${VM_USER}@${VM_HOST}:/tmp/dots-release.tgz"

      - name: Deploy on VM
        run: ssh -i ~/.ssh/id_deploy "${VM_USER}@${VM_HOST}" "sudo /usr/local/bin/dots-deploy /tmp/dots-release.tgz ${GITHUB_SHA}"

      - name: Smoke test through Cloudflare
        if: vars.APP_URL != ''
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "${{ vars.APP_URL }}/healthz"; then exit 0; fi
            sleep 5
          done
          echo "::warning::${{ vars.APP_URL }}/healthz did not answer. The VM deploy succeeded; check DNS/Cloudflare."

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy

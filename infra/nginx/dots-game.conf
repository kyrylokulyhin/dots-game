# Nginx server block for the dots-game subdomain.
#
# This is a TEMPLATE — placeholders are substituted by infra/scripts/setup-vm.sh.
# Do not edit /etc/nginx/sites-available/dots-game directly; edit this file and re-run setup-vm.sh.
#
# Placeholders:
#   DOTS_SUBDOMAIN   e.g. dots.example.com
#   DOTS_APP_PATH    e.g. /var/www/dots-game
#   DOTS_SERVER_PORT e.g. 3001

server {
    listen 80;
    server_name DOTS_SUBDOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOTS_SUBDOMAIN;

    # Cloudflare Origin CA certificate (same wildcard cert shared with other vhosts)
    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/private/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  DOTS_APP_PATH/current/frontend;
    index index.html;

    # Serve the single-page frontend
    location / {
        try_files $uri /index.html;
    }

    # Proxy WebSocket connections (/ws/:game_code) to the Rust server
    location /ws/ {
        proxy_pass         http://127.0.0.1:DOTS_SERVER_PORT;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep idle WebSocket connections open for up to 1 hour
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
